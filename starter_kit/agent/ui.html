<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoomQ 量子助手</title>
<style>
/* Win98 皮肤：全部内联，零 CDN、零外部字体（评测环境不保证外网）。 */
:root{
  --face:#c0c0c0; --hi:#ffffff; --sh:#808080; --dk:#000000;
  --title1:#000080; --title2:#1084d0; --field:#ffffff; --ok:#008000; --err:#a80000;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; padding:18px; background:#008080;
  font-family:"MS Sans Serif",Tahoma,Geneva,Verdana,sans-serif; font-size:13px; color:#000;
}
/* 斜角边框：凸起与凹陷 */
.out{border:2px solid; border-color:var(--hi) var(--dk) var(--dk) var(--hi)}
.in{border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh)}

.window{max-width:860px; margin:0 auto; background:var(--face); padding:3px}
.titlebar{
  display:flex; align-items:center; gap:6px; padding:3px 4px; color:#fff; font-weight:bold;
  background:linear-gradient(90deg,var(--title1),var(--title2));
}
.titlebar .t{flex:1}
.tbtn{
  width:18px; height:16px; background:var(--face); color:#000; font-size:10px; line-height:12px;
  text-align:center; font-weight:bold; font-family:Tahoma,sans-serif;
}
.menubar{display:flex; gap:14px; padding:3px 6px; border-bottom:1px solid var(--sh)}
.menubar span{padding:1px 4px}
.menubar span u{text-decoration:underline}
.body{padding:12px}

fieldset{border:2px groove var(--hi); margin:0 0 12px; padding:10px}
legend{padding:0 4px; font-weight:bold}
label{display:block; margin-bottom:6px}

textarea,input[type=text]{
  width:100%; padding:4px; font-family:"Courier New",monospace; font-size:13px;
  background:var(--field); border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);
  resize:vertical;
}
textarea{min-height:64px}

.row{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; align-items:center}
button{
  min-width:96px; padding:5px 12px; background:var(--face); font-family:inherit; font-size:13px;
  border:2px solid; border-color:var(--hi) var(--dk) var(--dk) var(--hi); cursor:pointer;
}
button:active:not(:disabled){border-color:var(--sh) var(--hi) var(--hi) var(--sh); padding:6px 11px 4px 13px}
button:disabled{color:var(--sh); text-shadow:1px 1px 0 var(--hi); cursor:default}
button:focus-visible{outline:1px dotted #000; outline-offset:-5px}

/* 进度条：方块填充 */
.progress{height:20px; padding:2px; background:var(--face); display:none}
.progress.on{display:block}
.bar{height:100%; display:flex; gap:2px; overflow:hidden}
.bar i{width:12px; flex:0 0 12px; background:var(--title1); animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.35}}

.steps{margin:10px 0 0; padding:0; list-style:none}
.steps li{padding:2px 0}
.steps li.ok::before{content:"\2713 "; color:var(--ok); font-weight:bold}
.steps li.err::before{content:"\2717 "; color:var(--err); font-weight:bold}
.steps li.run::before{content:"\00bb "; font-weight:bold}

/* 选项卡 */
.tabs{display:flex; gap:2px; margin-top:14px}
.tab{
  padding:4px 12px; background:var(--face); cursor:pointer;
  border:2px solid; border-color:var(--hi) var(--dk) var(--dk) var(--hi); border-bottom:none;
}
.tab[aria-selected=true]{font-weight:bold; padding-bottom:6px; margin-bottom:-2px; position:relative; z-index:1}
.panel{padding:10px; background:var(--field); min-height:260px; overflow:auto}
.panel pre{margin:0; font-family:"Courier New",monospace; font-size:13px; white-space:pre}

/* 结构化 SVG 电路图：保留复古外壳，电路本身使用标准量子门符号。 */
.circuit-scroll{min-width:max-content}
.circuit-svg{display:block; width:auto; min-width:100%; height:auto; color:#111; background:var(--field)}
.circuit-svg text{font-family:Tahoma,Geneva,Verdana,sans-serif; fill:#111; user-select:none}
.circuit-svg .wire,.circuit-svg .connector{stroke:#222; stroke-width:2; fill:none}
.circuit-svg .connector{stroke-width:2.5}
.circuit-svg .box{fill:#f7f7f7; stroke:#111; stroke-width:2}
.circuit-svg .control,.circuit-svg .target{fill:#111; stroke:#111; stroke-width:2}
.circuit-svg .target{fill:#fff}
.circuit-svg .target-line{stroke:#111; stroke-width:2}
.circuit-svg .swap-line{stroke:#111; stroke-width:3}
.circuit-svg .gate{cursor:pointer}
.circuit-svg .gate:hover .box,.circuit-svg .gate:focus .box,
.circuit-svg .gate.selected .box{fill:#ffffd8; stroke:var(--title2); stroke-width:3}
.circuit-svg .gate:hover .control,.circuit-svg .gate:focus .control,
.circuit-svg .gate.selected .control{fill:var(--title2); stroke:var(--title2)}
.circuit-svg .gate:focus{outline:none}
.circuit-svg .step{font-size:11px; fill:#555; text-anchor:middle}
.circuit-svg .qlabel{font:13px "Courier New",monospace; text-anchor:end}
.circuit-svg .clabel{font:12px "Courier New",monospace}
.circuit-svg .gate-label{font-size:14px; font-weight:bold; text-anchor:middle; dominant-baseline:middle}
.circuit-svg .param{font:10px "Courier New",monospace; text-anchor:middle}
.circuit-svg .measure-title{font-size:11px; fill:#555; text-anchor:middle}
.circuit-svg .meter{stroke:#111; stroke-width:1.7; fill:none}
.circuit-detail{margin-top:8px; padding:6px 8px; min-height:29px; background:#ffffe1; border:1px solid #808080}
.circuit-legend{margin-top:6px; color:#333; font-size:12px}
.basis{margin-top:12px; padding:7px 8px; background:#ffffe1; border:1px solid #808080; font-size:12px}

/* 结果柱状图 */
.hist{display:flex; align-items:flex-end; gap:10px; height:130px; padding-top:6px}
.hist .col{display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%}
.hist .b{width:38px; background:var(--title2); border:1px solid var(--dk); min-height:2px}
.hist .k{font-family:"Courier New",monospace; margin-top:3px}
.hist .v{font-size:11px; color:#333}

.status{margin-top:12px; padding:3px 6px; display:flex; gap:8px}
.status .cell{padding:1px 6px}
.status .cell:first-child{flex:1}
.muted{color:#333}
.err-text{color:var(--err)}
.hint{margin:8px 0 0; padding:8px; background:#ffffe1; border:1px solid var(--dk)}
</style>
</head>
<body>
<div class="window out">
  <div class="titlebar">
    <span class="t">LoomQ 量子助手 — 用大白话造量子电路</span>
    <span class="tbtn out" aria-hidden="true">_</span>
    <span class="tbtn out" aria-hidden="true">□</span>
    <span class="tbtn out" aria-hidden="true">✕</span>
  </div>
  <div class="menubar"><span><u>文</u>件</span><span><u>编</u>辑</span><span><u>查</u>看</span><span><u>帮</u>助</span></div>

  <div class="body">
    <fieldset>
      <legend>想做什么？</legend>
      <label for="prompt">用大白话说就行，不需要懂量子：</label>
      <textarea id="prompt" placeholder="例如：让三个量子比特纠缠在一起"></textarea>
      <div class="row">
        <button id="go">开始构建</button>
        <button id="demo">我不知道问些什么</button>
        <span id="hintline" class="muted"></span>
      </div>
      <div id="examples" class="hint" hidden>
        <strong>试试这些：</strong>
        <div class="row">
          <button class="ex" data-p="让三个量子比特纠缠在一起">三比特纠缠</button>
          <button class="ex" data-p="做一个贝尔态">贝尔态</button>
          <button class="ex" data-p="我要跑 15 比特的电路，而且不想排队，选哪个平台？">选平台</button>
          <button class="ex" data-p="什么是量子纠缠？">认识量子纠缠</button>
        </div>
      </div>
    </fieldset>

    <div id="progress" class="progress in"><div class="bar" id="bar"></div></div>
    <ul id="steps" class="steps"></ul>

    <div class="tabs" role="tablist">
      <div class="tab out" role="tab" data-t="circuit" aria-selected="true" tabindex="0">电路图</div>
      <div class="tab out" role="tab" data-t="result"  aria-selected="false" tabindex="0">运行结果</div>
      <div class="tab out" role="tab" data-t="qasm"    aria-selected="false" tabindex="0">QASM</div>
      <div class="tab out" role="tab" data-t="explain" aria-selected="false" tabindex="0">这是啥？</div>
    </div>
    <div class="panel in" id="panel"><span class="muted">还没有电路。上面说一句话，然后点「开始构建」。</span></div>

    <div class="status">
      <span class="cell in" id="status">就绪</span>
      <span class="cell in" id="fid">保真度 —</span>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let state = {diagram:"", circuitData:null, result:null, qasm:"", explain:"", backend:null, basis:null};

function steps(items){
  $("steps").innerHTML = items.map(s => `<li class="${s.k}">${s.t}</li>`).join("");
}
function busy(on){
  $("progress").classList.toggle("on", on);
  $("bar").innerHTML = on ? "<i></i>".repeat(14) : "";
  $("go").disabled = on;
  $("status").textContent = on ? "正在处理…" : "就绪";
}
function esc(s){ return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function escAttr(s){ return esc(s).replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

const GATE_LABEL = {
  h:"H", x:"X", s:"S", sdg:"S†", t:"T", tdg:"T†", ry:"Ry", rz:"Rz",
  cx:"CNOT", cu1:"CU1", swap:"SWAP", ccx:"Toffoli"
};

function shortParam(value){
  const text = String(value || "").replace(/\s+/g, "");
  return text.length > 11 ? text.slice(0, 10) + "…" : text;
}

function operationText(op, index){
  const qubits = op.qubits.map(q => `q${q}`).join("、");
  const parameter = op.parameter ? `，参数 ${op.parameter}` : "";
  return `步骤 ${index + 1}：${GATE_LABEL[op.name] || op.name.toUpperCase()}，作用于 ${qubits}${parameter}`;
}

function targetMark(x, y){
  return `<circle class="target" cx="${x}" cy="${y}" r="11"></circle>`
    + `<line class="target-line" x1="${x-7}" y1="${y}" x2="${x+7}" y2="${y}"></line>`
    + `<line class="target-line" x1="${x}" y1="${y-7}" x2="${x}" y2="${y+7}"></line>`;
}

function swapMark(x, y){
  return `<line class="swap-line" x1="${x-8}" y1="${y-8}" x2="${x+8}" y2="${y+8}"></line>`
    + `<line class="swap-line" x1="${x+8}" y1="${y-8}" x2="${x-8}" y2="${y+8}"></line>`;
}

function boxGate(x, y, label, parameter=""){
  return `<rect class="box" x="${x-27}" y="${y-22}" width="54" height="44"></rect>`
    + `<text class="gate-label" x="${x}" y="${parameter ? y-5 : y}">${esc(label)}</text>`
    + (parameter ? `<text class="param" x="${x}" y="${y+13}">${esc(shortParam(parameter))}</text>` : "");
}

function circuitSvg(circuit){
  const operations = circuit.operations || [];
  const measurements = circuit.measurements || [];
  const qubits = Math.max(1, circuit.qubit_count || 1);
  const left = 64, top = 50, rowGap = 68, columnGap = 84;
  const firstGateX = left + 56;
  const measureX = firstGateX + operations.length * columnGap + 24;
  const width = Math.max(620, measureX + 145);
  const height = Math.max(190, top + (qubits - 1) * rowGap + 70);
  const y = q => top + q * rowGap;
  const parts = [
    `<svg class="circuit-svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="量子电路图">`,
    `<defs><marker id="c-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"></path></marker></defs>`,
    `<text class="measure-title" x="${measureX}" y="20">测量</text>`
  ];

  for(let q=0; q<qubits; q++){
    parts.push(`<text class="qlabel" x="${left-12}" y="${y(q)+5}">q[${q}]</text>`);
    parts.push(`<line class="wire" x1="${left}" y1="${y(q)}" x2="${width-42}" y2="${y(q)}"></line>`);
  }

  operations.forEach((op, index) => {
    const x = firstGateX + index * columnGap;
    const ys = op.qubits.map(y);
    const title = operationText(op, index);
    parts.push(`<g class="gate" data-step="${index}" tabindex="0" role="button" aria-label="${escAttr(title)}"><title>${esc(title)}</title>`);
    parts.push(`<text class="step" x="${x}" y="20">${index+1}</text>`);
    if(op.name === "cx"){
      parts.push(`<line class="connector" x1="${x}" y1="${Math.min(...ys)}" x2="${x}" y2="${Math.max(...ys)}"></line>`);
      parts.push(`<circle class="control" cx="${x}" cy="${ys[0]}" r="6"></circle>`);
      parts.push(targetMark(x, ys[1]));
    }else if(op.name === "cu1"){
      parts.push(`<line class="connector" x1="${x}" y1="${Math.min(...ys)}" x2="${x}" y2="${Math.max(...ys)}"></line>`);
      parts.push(`<circle class="control" cx="${x}" cy="${ys[0]}" r="6"></circle>`);
      parts.push(boxGate(x, ys[1], "U1", op.parameter));
    }else if(op.name === "swap"){
      parts.push(`<line class="connector" x1="${x}" y1="${Math.min(...ys)}" x2="${x}" y2="${Math.max(...ys)}"></line>`);
      parts.push(swapMark(x, ys[0]), swapMark(x, ys[1]));
    }else if(op.name === "ccx"){
      parts.push(`<line class="connector" x1="${x}" y1="${Math.min(...ys)}" x2="${x}" y2="${Math.max(...ys)}"></line>`);
      parts.push(`<circle class="control" cx="${x}" cy="${ys[0]}" r="6"></circle>`);
      parts.push(`<circle class="control" cx="${x}" cy="${ys[1]}" r="6"></circle>`);
      parts.push(targetMark(x, ys[2]));
    }else{
      parts.push(boxGate(x, ys[0], GATE_LABEL[op.name] || op.name.toUpperCase(), op.parameter));
    }
    parts.push(`</g>`);
  });

  measurements.forEach(m => {
    const my = y(m.qubit);
    parts.push(`<g aria-label="测量 q${m.qubit} 到 c${m.cbit}">`);
    parts.push(`<rect class="box" x="${measureX-22}" y="${my-19}" width="44" height="38"></rect>`);
    parts.push(`<path class="meter" d="M ${measureX-12} ${my+9} A 13 13 0 0 1 ${measureX+12} ${my+9}"></path>`);
    parts.push(`<line class="meter" x1="${measureX}" y1="${my+8}" x2="${measureX+10}" y2="${my-8}"></line>`);
    parts.push(`<line class="wire" x1="${measureX+22}" y1="${my}" x2="${width-54}" y2="${my}" marker-end="url(#c-arrow)"></line>`);
    parts.push(`<text class="clabel" x="${width-48}" y="${my+5}">c[${m.cbit}]</text></g>`);
  });

  parts.push(`</svg>`);
  return `<div class="circuit-scroll">${parts.join("")}</div>`
    + `<div class="circuit-legend">● 控制位　⊕ 条件翻转　× 交换　仪表为测量；编号表示执行顺序。</div>`
    + `<div class="circuit-detail" aria-live="polite">点击或用键盘聚焦一个门，查看这一步的完整信息。</div>`;
}

function bindCircuit(panel){
  const detail = panel.querySelector(".circuit-detail");
  panel.querySelectorAll(".gate").forEach(gate => {
    const show = () => {
      panel.querySelectorAll(".gate").forEach(item => item.classList.toggle("selected", item === gate));
      detail.textContent = operationText(state.circuitData.operations[Number(gate.dataset.step)], Number(gate.dataset.step));
    };
    gate.addEventListener("click", show);
    gate.addEventListener("focus", show);
    gate.addEventListener("keydown", event => {
      if(event.key === "Enter" || event.key === " "){ event.preventDefault(); show(); }
    });
  });
}

function basisHtml(basis){
  if(!basis) return "";
  return `<div class="basis"><strong>依据：</strong>${esc(basis.source)} ${esc(basis.version)}；${esc(basis.status)}。</div>`;
}

function histogram(probs){
  const keys = Object.keys(probs).sort();
  if(!keys.length) return '<span class="muted">没有结果。</span>';
  const max = Math.max(...keys.map(k => probs[k]));
  return '<div class="hist">' + keys.map(k => {
    const h = Math.round((probs[k]/max) * 105) + 2;
    return `<div class="col"><span class="v">${(probs[k]*100).toFixed(1)}%</span>`
         + `<div class="b" style="height:${h}px"></div><span class="k">${esc(k)}</span></div>`;
  }).join("") + "</div>";
}

function render(tab){
  const p = $("panel");
  if(tab === "circuit"){
    if(state.circuitData){ p.innerHTML = circuitSvg(state.circuitData); bindCircuit(p); }
    else if(state.diagram) p.innerHTML = `<pre>${esc(state.diagram)}</pre>`;
    else p.innerHTML = '<span class="muted">还没有电路。</span>';
  }
  else if(tab === "result") p.innerHTML = state.result ? histogram(state.result)
      : '<span class="muted">还没有运行结果。</span>';
  else if(tab === "qasm") p.innerHTML = state.qasm ? `<pre>${esc(state.qasm)}</pre>`
      : '<span class="muted">还没有 QASM。</span>';
  else p.innerHTML = state.explain ? `<div>${esc(state.explain).replace(/\n/g,"<br>")}</div>${basisHtml(state.basis)}`
      : '<span class="muted">构建一个电路后，这里会用大白话解释它在做什么。</span>';
}

document.querySelectorAll(".tab").forEach(t => {
  const pick = () => {
    document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", String(x === t)));
    render(t.dataset.t);
  };
  t.addEventListener("click", pick);
  t.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(); }});
});

$("demo").addEventListener("click", () => {
  const box = $("examples");
  box.hidden = !box.hidden;
});
document.querySelectorAll(".ex").forEach(b =>
  b.addEventListener("click", () => { $("prompt").value = b.dataset.p; $("examples").hidden = true; build(); }));

$("prompt").addEventListener("keydown", e => {
  if((e.ctrlKey || e.metaKey) && e.key === "Enter") build();
});
$("go").addEventListener("click", build);

async function build(){
  const prompt = $("prompt").value.trim();
  if(!prompt){
    steps([{k:"err", t:"先说一句你想做什么 —— 比如「让三个量子比特纠缠在一起」。"}]);
    $("prompt").focus();
    return;
  }
  busy(true);
  steps([{k:"run", t:"正在理解你的意思…"}]);
  try{
    const res = await fetch("/api/build", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({prompt})
    });
    const data = await res.json();
    if(data.kind === "explanation"){
      state = {diagram:"", circuitData:null, result:null, qasm:"", explain:data.explain, backend:null, basis:null};
      steps([{k:"ok", t:"听懂了：你想了解一个量子概念"}, {k:"ok", t:"已用大白话解释"}]);
      $("fid").textContent = "保真度 —";
      document.querySelectorAll(".tab").forEach(x =>
        x.setAttribute("aria-selected", String(x.dataset.t === "explain")));
      render("explain");
    } else if(data.kind === "backend"){
      state = {diagram:"", circuitData:null, result:null, qasm:"", explain:data.explain, backend:data.backend, basis:data.basis || null};
      steps([{k:"ok", t:"听懂了：你在挑运行平台"}, {k:"ok", t:"已按官方后端能力表筛选"}]);
      $("fid").textContent = "保真度 —";
      document.querySelectorAll(".tab").forEach(x =>
        x.setAttribute("aria-selected", String(x.dataset.t === "explain")));
      render("explain");
    } else if(data.ok){
      state = {diagram:data.diagram, circuitData:data.circuit || null, result:data.probabilities, qasm:data.qasm, explain:data.explain, backend:null, basis:null};
      const list = [{k:"ok", t:`听懂了：${esc(data.intent)}`}, {k:"ok", t:"生成电路"}];
      list.push(data.fidelity !== null
        ? {k:"ok", t:`自检通过 —— 保真度 ${data.fidelity.toFixed(2)}`}
        : {k:"ok", t:"语法自检通过"});
      steps(list);
      $("fid").textContent = data.fidelity !== null ? `保真度 ${data.fidelity.toFixed(2)}` : "保真度 —";
      document.querySelectorAll(".tab").forEach(x =>
        x.setAttribute("aria-selected", String(x.dataset.t === "circuit")));
      render("circuit");
    } else {
      steps([{k:"err", t:esc(data.message)}]);
      $("fid").textContent = "保真度 —";
      if(data.qasm){ state.qasm = data.qasm; }
    }
  }catch(err){
    steps([{k:"err", t:"连不上本地服务，请确认终端里的服务还在运行。"}]);
  }finally{
    busy(false);
  }
}
render("circuit");
</script>
</body>
</html>

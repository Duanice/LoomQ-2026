<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoomQ 量子助手</title>
<style>
/*
 * Y2K UI manual adapter: the official palette and component geometry are
 * mapped to this dependency-free page so the submission remains offline-safe.
 * Source: https://github.com/MuhamadZafarSyah/y2k-ui (MIT)
 */
:root{
  --y2k-ink:#1b1b3a; --y2k-ink-muted:#505266; --y2k-blue:#8ed1fc;
  --y2k-pink:#ff8fcf; --y2k-lilac:#b69cff; --y2k-mint:#8ff0d0;
  --y2k-lemon:#ffe45e; --y2k-panel:#d7dde8; --field:#ffffff;
  --ok:#147a5c; --err:#b42345; --title2:var(--y2k-pink); --dk:var(--y2k-ink);
}
*{box-sizing:border-box}
html,body{min-height:100%}
[hidden]{display:none!important}
body{
  margin:0; padding:22px; color:var(--y2k-ink); font-size:14px;
  font-family:"Trebuchet MS",Tahoma,Geneva,Verdana,sans-serif;
  background-color:#f6f4ff;
  background-image:
    linear-gradient(90deg,rgba(182,156,255,.16) 1px,transparent 1px),
    linear-gradient(rgba(142,209,252,.18) 1px,transparent 1px);
  background-size:24px 24px;
}
.out,.in{border:2px solid var(--y2k-ink)}

/* Landing page: two honest entry points into the same builder workflow. */
.landing{max-width:1180px; margin:0 auto}
.landing-header{
  display:flex; align-items:center; justify-content:space-between; gap:16px; padding:13px 16px;
  border:2px solid var(--y2k-ink); border-radius:7px; background:#fff;
  box-shadow:5px 5px 0 var(--y2k-ink);
}
.brand{display:flex; align-items:center; gap:10px; font-size:24px; font-weight:800; letter-spacing:-.04em}
.brand-mark{
  display:grid; width:34px; height:34px; place-items:center; border:2px solid var(--y2k-ink);
  border-radius:6px; background:var(--y2k-lilac); box-shadow:2px 2px 0 var(--y2k-ink);
}
.ready{
  display:flex; align-items:center; gap:8px; padding:7px 10px; border:2px solid var(--y2k-ink);
  border-radius:5px; background:var(--y2k-mint); font:700 12px/1 ui-monospace,monospace;
}
.ready::before{content:""; width:9px; height:9px; border:1px solid var(--y2k-ink); border-radius:50%; background:#1bbf8b}
.landing-grid{display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr); gap:22px; margin-top:28px}
.hero-window{
  overflow:hidden; border:2px solid var(--y2k-ink); border-radius:8px; background:#fff;
  box-shadow:7px 7px 0 var(--y2k-ink);
}
.landing-titlebar{
  display:flex; min-height:48px; align-items:center; justify-content:space-between; gap:12px;
  padding:9px 12px; border-bottom:2px solid var(--y2k-ink); background:var(--y2k-lilac);
  font:700 13px/1 ui-monospace,monospace;
}
.title-dots{display:flex; gap:6px}
.title-dots i{display:block; width:18px; height:18px; border:2px solid var(--y2k-ink); border-radius:3px; background:var(--y2k-pink)}
.title-dots i:nth-child(2){background:var(--y2k-lemon)}
.title-dots i:nth-child(3){background:var(--y2k-mint)}
.hero-copy{display:flex; min-height:520px; flex-direction:column; justify-content:center; padding:44px 34px}
.eyebrow{margin:0 0 18px; color:#7858d5; font-size:12px; font-weight:800; letter-spacing:.09em}
.hero-copy h1{max-width:470px; margin:0; font-size:clamp(42px,5vw,66px); line-height:1.08; letter-spacing:-.06em}
.hero-copy>p:not(.eyebrow):not(.microcopy){margin:24px 0 0; color:var(--y2k-ink-muted); font-size:17px; line-height:1.75}
.hero-actions{display:flex; gap:12px; margin-top:34px}
.hero-actions button{flex:1; min-height:52px; padding:10px 15px; font-weight:800}
#launch-demo{background:var(--y2k-blue)}
#get-started{background:var(--y2k-pink)}
.microcopy{margin:15px 0 0!important; font-size:12px!important; font-weight:600}
.app-view{min-width:0; padding-bottom:8px}
.app-view .window{max-width:none; margin:0}
.landing.builder-mode{max-width:860px}
.landing.builder-mode .landing-header,.landing.builder-mode .hero-window{display:none}
.landing.builder-mode .landing-grid{display:block; margin-top:0}

.window{
  max-width:860px; margin:0 auto; padding:0; overflow:hidden; background:#fff;
  border-radius:8px; box-shadow:6px 6px 0 var(--y2k-ink);
}
.titlebar{
  display:flex; align-items:center; gap:7px; padding:9px 11px; color:var(--y2k-ink);
  background:var(--y2k-blue); border-bottom:2px solid var(--y2k-ink); font-weight:700;
}
.titlebar .t{flex:1; letter-spacing:.01em}
.tbtn{
  display:inline-flex; width:20px; height:20px; align-items:center; justify-content:center;
  border-radius:3px; background:#fff; color:var(--y2k-ink); font:700 11px/1 Tahoma,sans-serif;
}
.tbtn:nth-last-child(3){background:var(--y2k-lemon)}
.tbtn:nth-last-child(2){background:var(--y2k-mint)}
.tbtn:last-child{background:var(--y2k-pink)}
.menubar{
  display:flex; gap:16px; padding:7px 10px; background:var(--y2k-panel);
  border-bottom:2px solid var(--y2k-ink); font-size:13px; font-weight:600;
}
.menubar span{padding:2px 4px; border-radius:3px}
.menubar span:hover{background:var(--y2k-lilac)}
.menubar span u{text-decoration:underline; text-underline-offset:2px}
.body{padding:16px; background:#fdfcff}

fieldset{
  margin:0 0 14px; padding:13px; border:2px solid var(--y2k-ink);
  border-radius:7px; background:#fff; box-shadow:3px 3px 0 var(--y2k-panel);
}
legend{
  padding:3px 8px; border:2px solid var(--y2k-ink); border-radius:5px;
  background:var(--y2k-lemon); font-weight:700;
}
label{display:block; margin:2px 0 8px; font-weight:600}

textarea,input[type=text]{
  width:100%; padding:10px 11px; color:var(--y2k-ink); background:var(--field);
  border:2px solid var(--y2k-ink); border-radius:5px; outline:none; resize:vertical;
  font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Monaco,"Courier New",monospace;
  transition:box-shadow .15s ease,background .15s ease;
}
textarea{min-height:84px}
textarea::placeholder,input[type=text]::placeholder{color:var(--y2k-ink-muted); opacity:.7}
textarea:focus-visible,input[type=text]:focus-visible{box-shadow:0 0 0 3px rgba(255,143,207,.55)}

.row{display:flex; gap:9px; flex-wrap:wrap; margin-top:10px; align-items:center}
button{
  min-width:96px; padding:8px 14px; color:var(--y2k-ink); background:var(--y2k-lemon);
  border:2px solid var(--y2k-ink); border-radius:6px; cursor:pointer; user-select:none;
  font:600 14px/1.2 inherit; transition:transform .1s ease,background .15s ease;
}
#demo{background:var(--y2k-blue)}
.ex{background:var(--y2k-pink)}
.ex:nth-child(2n){background:var(--y2k-mint)}
button:hover:not(:disabled){background:var(--y2k-lilac)}
button:active:not(:disabled){transform:translateY(2px) scale(.98)}
button:disabled{opacity:.48; cursor:not-allowed}
button:focus-visible{outline:3px solid rgba(255,143,207,.65); outline-offset:2px}

.progress{
  display:none; height:22px; padding:3px; overflow:hidden; background:#fff;
  border-radius:5px;
}
.progress.on{display:block}
.bar{display:flex; height:100%; gap:3px; overflow:hidden}
.bar i{
  width:13px; flex:0 0 13px; border:1px solid var(--y2k-ink); border-radius:2px;
  background:var(--y2k-blue); animation:blink 1s steps(1) infinite;
}
.bar i:nth-child(2n){background:var(--y2k-pink)}
@keyframes blink{50%{opacity:.35}}

.steps{margin:11px 0 0; padding:0; list-style:none}
.steps li{padding:3px 0; font-weight:600}
.steps li.ok::before{content:"\2713 "; color:var(--ok); font-weight:800}
.steps li.err::before{content:"\2717 "; color:var(--err); font-weight:800}
.steps li.run::before{content:"\00bb "; color:var(--y2k-lilac); font-weight:800}

/* Y2K UI tabs: a shared ink baseline with pastel triggers and a white panel. */
.tabs{
  display:flex; align-items:flex-end; gap:4px; margin-top:16px;
  border-bottom:2px solid var(--y2k-ink);
}
.tab{
  margin-bottom:-2px; padding:7px 12px; color:var(--y2k-ink); background:var(--y2k-panel);
  border:2px solid var(--y2k-ink); border-bottom:0; border-radius:5px 5px 0 0;
  cursor:pointer; font-size:13px; font-weight:700; transition:background .15s ease;
}
.tab:hover{background:var(--y2k-lilac)}
.tab:focus-visible{outline:3px solid rgba(255,143,207,.65); outline-offset:2px}
.tab[aria-selected=true]{position:relative; z-index:1; padding-bottom:9px; background:var(--y2k-lemon)}
.panel{
  min-height:260px; padding:13px; overflow:auto; color:var(--y2k-ink); background:#fff;
  border-top:0; border-radius:0 0 6px 6px;
}
.panel pre{
  margin:0; white-space:pre; font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Monaco,"Courier New",monospace;
}

/* 结构化 SVG 电路图：只换 Y2K UI 视觉令牌，量子门语义和交互保持不变。 */
.circuit-scroll{min-width:max-content}
.circuit-svg{display:block; width:auto; min-width:100%; height:auto; color:var(--y2k-ink); background:#fff}
.circuit-svg text{font-family:Tahoma,Geneva,Verdana,sans-serif; fill:var(--y2k-ink); user-select:none}
.circuit-svg .wire,.circuit-svg .connector{stroke:var(--y2k-ink); stroke-width:2; fill:none}
.circuit-svg .connector{stroke-width:2.5}
.circuit-svg .box{fill:#fff; stroke:var(--y2k-ink); stroke-width:2}
.circuit-svg .control,.circuit-svg .target{fill:var(--y2k-ink); stroke:var(--y2k-ink); stroke-width:2}
.circuit-svg .target{fill:#fff}
.circuit-svg .target-line{stroke:var(--y2k-ink); stroke-width:2}
.circuit-svg .swap-line{stroke:var(--y2k-ink); stroke-width:3}
.circuit-svg .gate{cursor:pointer}
.circuit-svg .gate:hover .box,.circuit-svg .gate:focus .box,
.circuit-svg .gate.selected .box{fill:var(--y2k-lemon); stroke:var(--y2k-pink); stroke-width:3}
.circuit-svg .gate:hover .control,.circuit-svg .gate:focus .control,
.circuit-svg .gate.selected .control{fill:var(--y2k-pink); stroke:var(--y2k-ink)}
.circuit-svg .gate:focus{outline:none}
.circuit-svg .step{font-size:11px; fill:var(--y2k-ink-muted); text-anchor:middle}
.circuit-svg .qlabel{font:13px ui-monospace,SFMono-Regular,Menlo,Monaco,"Courier New",monospace; text-anchor:end}
.circuit-svg .clabel{font:12px ui-monospace,SFMono-Regular,Menlo,Monaco,"Courier New",monospace}
.circuit-svg .gate-label{font-size:14px; font-weight:bold; text-anchor:middle; dominant-baseline:middle}
.circuit-svg .param{font:10px ui-monospace,SFMono-Regular,Menlo,Monaco,"Courier New",monospace; text-anchor:middle}
.circuit-svg .measure-title{font-size:11px; fill:var(--y2k-ink-muted); text-anchor:middle}
.circuit-svg .meter{stroke:var(--y2k-ink); stroke-width:1.7; fill:none}
.circuit-detail,.basis{
  margin-top:9px; padding:8px 10px; border:2px solid var(--y2k-ink); border-radius:5px;
  background:rgba(143,240,208,.28);
}
.circuit-detail{min-height:34px;white-space:pre-line}
.circuit-legend{margin-top:7px; color:var(--y2k-ink-muted); font-size:12px}
.basis{margin-top:12px; background:rgba(255,228,94,.35); font-size:12px}

/* 模型只返回受校验的数据；这些组件负责安全地把数据画成教学卡片。 */
.lesson{display:grid; gap:13px; max-width:920px}
.lesson-head{
  padding:15px 17px; border:2px solid var(--y2k-ink); border-radius:7px;
  background:linear-gradient(135deg,rgba(142,209,252,.5),rgba(179,151,255,.32));
  box-shadow:4px 4px 0 var(--y2k-ink);
}
.lesson-kicker{font:800 10px/1 ui-monospace,monospace; letter-spacing:.11em; color:#6547c7}
.lesson h2{margin:7px 0 5px; font-size:22px; line-height:1.2}
.lesson-summary{margin:0; font-size:14px; line-height:1.65}
.lesson-visual{
  margin:0; padding:13px; border:2px solid var(--y2k-ink); border-radius:7px;
  background:rgba(255,228,94,.2);
}
.visual-track{display:flex; align-items:stretch; gap:28px; overflow-x:auto; padding:4px 2px 7px}
.visual-node{
  position:relative; min-width:125px; flex:1; padding:10px; text-align:center;
  border:2px solid var(--y2k-ink); border-radius:6px; background:#fff;
  box-shadow:3px 3px 0 var(--y2k-ink);
}
.visual-node:nth-child(2n){background:rgba(255,143,207,.3)}
.visual-node strong{display:block; margin-bottom:5px; font-size:13px}
.visual-node span{display:block; color:var(--y2k-ink-muted); font-size:11px; line-height:1.45}
.visual-flow .visual-node:not(:last-child)::after{
  content:"→"; position:absolute; z-index:2; right:-23px; top:50%;
  transform:translateY(-50%); font-size:21px; font-weight:900;
}
.visual-compare .visual-node:first-child{background:rgba(142,209,252,.35)}
.visual-compare .visual-node:last-child{background:rgba(143,240,208,.35)}
.visual-relation{align-items:center; gap:12px}
.visual-relation .visual-node:first-child{background:rgba(142,209,252,.35)}
.visual-relation .visual-node:last-child{background:rgba(255,143,207,.26)}
.visual-link{
  min-width:120px; padding:7px 9px; text-align:center; border:2px solid var(--y2k-ink);
  border-radius:999px; background:var(--y2k-lemon); font-size:11px; font-weight:800;
}
.visual-link::before,.visual-link::after{content:"—"; margin:0 4px}
.lesson-visual figcaption{margin-top:7px; color:var(--y2k-ink-muted); font-size:11px; text-align:center}
.lesson-cards{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.lesson-card{
  min-height:110px; padding:12px; border:2px solid var(--y2k-ink); border-radius:6px;
  background:#fff; box-shadow:3px 3px 0 var(--y2k-panel);
}
.lesson-card:nth-child(2){background:rgba(142,209,252,.22)}
.lesson-card:nth-child(3){background:rgba(143,240,208,.22)}
.lesson-card:nth-child(4){background:rgba(255,143,207,.2)}
.lesson-card h3{margin:0 0 7px; font-size:14px}
.lesson-card p{margin:0; color:var(--y2k-ink-muted); font-size:12px; line-height:1.6}
.lesson-icon{display:inline-grid; width:23px; height:23px; margin-right:6px; place-items:center;
  border:2px solid var(--y2k-ink); border-radius:50%; background:var(--y2k-lemon); font-size:11px}
.lesson-takeaway{padding:10px 12px; border:2px solid var(--y2k-ink); border-radius:6px; background:var(--y2k-mint)}
.circuit-lesson-steps{display:grid; gap:8px}
.circuit-lesson-step{display:grid; grid-template-columns:31px 1fr; gap:9px; align-items:start;
  padding:10px; border:2px solid var(--y2k-ink); border-radius:6px; background:#fff}
.step-number{display:grid; width:29px; height:29px; place-items:center; border:2px solid var(--y2k-ink);
  border-radius:50%; background:var(--y2k-lemon); font-weight:800}
.circuit-lesson-step p{margin:0 0 4px; line-height:1.55}
.term-chip{display:inline-block; margin:3px 4px 0 0; padding:2px 6px; border:1px solid var(--y2k-ink);
  border-radius:999px; background:rgba(179,151,255,.22); font-size:10px}
.task-block{display:grid; gap:10px; margin-bottom:16px}
.task-block:last-child{margin-bottom:0}
.task-heading{display:flex; align-items:center; gap:9px; padding:9px 11px; border:2px solid var(--y2k-ink);
  border-radius:6px; background:var(--y2k-lemon)}
.task-heading span{padding:3px 7px; border:2px solid var(--y2k-ink); border-radius:999px; background:#fff;
  font-size:10px; font-weight:900}
.task-heading strong{font-size:15px}
.task-heading small{margin-left:auto; color:var(--y2k-ink-muted); font-weight:700}

/* 结果柱状图 */
.hist{display:flex; align-items:flex-end; gap:10px; height:130px; padding-top:6px}
.hist .col{display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%}
.hist .b{width:38px; min-height:2px; background:var(--y2k-blue); border:2px solid var(--y2k-ink); border-radius:3px 3px 0 0}
.hist .col:nth-child(2n) .b{background:var(--y2k-pink)}
.hist .k{margin-top:4px; font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,"Courier New",monospace}
.hist .v{font-size:11px; color:var(--y2k-ink-muted)}

.status{display:flex; gap:8px; margin-top:12px; padding:0}
.status .cell{padding:6px 9px; border-radius:5px; background:var(--y2k-panel)}
.status .cell:first-child{flex:1; background:rgba(142,209,252,.45)}
.muted{color:var(--y2k-ink-muted)}
.err-text{color:var(--err)}
.hint{
  margin:10px 0 0; padding:10px; background:rgba(255,143,207,.18);
  border:2px solid var(--y2k-ink); border-radius:6px;
}

::-webkit-scrollbar{width:14px; height:14px}
::-webkit-scrollbar-track{background:#fff; border:2px solid var(--y2k-ink); border-radius:4px}
::-webkit-scrollbar-thumb{background:var(--y2k-blue); border:2px solid var(--y2k-ink); border-radius:4px; min-height:28px}
::-webkit-scrollbar-thumb:hover{background:var(--y2k-pink)}
::-webkit-scrollbar-corner{background:#fff}

@media (max-width:640px){
  body{padding:10px; background-size:18px 18px}
  .landing-header{padding:10px 11px; box-shadow:4px 4px 0 var(--y2k-ink)}
  .brand{font-size:20px}
  .brand-mark{width:30px; height:30px}
  .ready{font-size:10px}
  .landing-grid{grid-template-columns:1fr; gap:17px; margin-top:18px}
  .hero-window{box-shadow:4px 4px 0 var(--y2k-ink)}
  .hero-copy{min-height:auto; padding:34px 22px}
  .hero-copy h1{font-size:42px}
  .hero-actions{flex-direction:column}
  .body{padding:11px}
  .window{box-shadow:4px 4px 0 var(--y2k-ink)}
  .titlebar{padding:8px}
  .titlebar .t{font-size:13px}
  .tbtn{width:18px; height:18px}
  .menubar{gap:7px; overflow:auto}
  .tab{padding:7px 8px; font-size:12px}
  .status{flex-direction:column}
  .lesson-cards{grid-template-columns:1fr}
  .visual-track{gap:24px}
  .visual-node{min-width:115px}
  .task-heading{align-items:flex-start; flex-wrap:wrap}
  .task-heading small{width:100%; margin-left:0}
}
</style>
</head>
<body>
<main id="landing" class="landing">
  <header class="landing-header">
    <div class="brand"><span class="brand-mark">L</span><span>LoomQ</span></div>
    <span class="ready">LOCAL UI READY</span>
  </header>

  <div class="landing-grid">
    <section class="hero-window" aria-labelledby="hero-title">
      <div class="landing-titlebar">
        <span class="title-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
      <div class="hero-copy">
        <p class="eyebrow">QUANTUM ACCESSIBILITY FOR EVERYONE</p>
        <h1 id="hero-title">用一句话，<br>造一条量子电路</h1>
        <p>从自然语言到跨平台运行结果，LoomQ 自动完成解析、生成、执行与验证。</p>
        <div class="hero-actions">
          <button id="launch-demo">▶ LAUNCH DEMO</button>
          <button id="get-started">GET STARTED →</button>
        </div>
        <p class="microcopy">无需量子基础 · 点击 GET STARTED 开始构建</p>
      </div>
    </section>

    <div id="app-view" class="app-view">
<div class="window out">
  <div class="titlebar">
    <span class="t">LoomQ 量子助手 — 用大白话造量子电路</span>
    <span class="tbtn out" aria-hidden="true">_</span>
    <span class="tbtn out" aria-hidden="true">□</span>
    <span class="tbtn out" aria-hidden="true">✕</span>
  </div>
  <div class="menubar"><span><u>文</u>件</span><span><u>编</u>辑</span><span><u>查</u>看</span><span><u>帮</u>助</span></div>

  <div class="body">
    <fieldset>
      <legend>想做什么？</legend>
      <label for="prompt">用大白话说就行，不需要懂量子：</label>
      <textarea id="prompt" placeholder="例如：让三个量子比特纠缠在一起"></textarea>
      <div class="row">
        <button id="go">开始构建</button>
        <button id="demo">我不知道问些什么</button>
        <span id="hintline" class="muted"></span>
      </div>
      <div id="examples" class="hint" hidden>
        <strong>试试这些：</strong>
        <div class="row">
          <button class="ex" data-p="让三个量子比特纠缠在一起">三比特纠缠</button>
          <button class="ex" data-p="做一个贝尔态">贝尔态</button>
          <button class="ex" data-p="我要跑 15 比特的电路，而且不想排队，选哪个平台？">选平台</button>
          <button class="ex" data-p="什么是量子纠缠？">认识量子纠缠</button>
        </div>
      </div>
    </fieldset>

    <div id="progress" class="progress in"><div class="bar" id="bar"></div></div>
    <ul id="steps" class="steps"></ul>

    <div class="tabs" role="tablist">
      <div class="tab out" role="tab" data-t="circuit" aria-selected="true" tabindex="0">电路图</div>
      <div class="tab out" role="tab" data-t="result"  aria-selected="false" tabindex="0">运行结果</div>
      <div class="tab out" role="tab" data-t="qasm"    aria-selected="false" tabindex="0">QASM</div>
      <div class="tab out" role="tab" data-t="explain" aria-selected="false" tabindex="0">这是啥？</div>
    </div>
    <div class="panel in" id="panel"><span class="muted">还没有电路。上面说一句话，然后点「开始构建」。</span></div>

    <div class="status">
      <span class="cell in" id="status">就绪</span>
      <span class="cell in" id="fid">保真度 —</span>
    </div>
  </div>
</div>
</div>
  </div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let state = {diagram:"", circuitData:null, result:null, expected:null, qasm:"", explain:"", explanation:null, concept:null, tasks:null, circuits:null, backend:null, basis:null};

function steps(items){
  $("steps").innerHTML = items.map(s => `<li class="${s.k}">${esc(s.t)}</li>`).join("");
}
function busy(on){
  $("progress").classList.toggle("on", on);
  $("bar").innerHTML = on ? "<i></i>".repeat(14) : "";
  $("go").disabled = on;
  $("status").textContent = on ? "正在处理…" : "就绪";
}
function esc(s){ return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function escAttr(s){ return esc(s).replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

const GATE_LABEL = {
  h:"H", x:"X", s:"S", sdg:"S†", t:"T", tdg:"T†", ry:"Ry", rz:"Rz",
  cx:"CNOT", cu1:"CU1", swap:"SWAP", ccx:"Toffoli"
};

function shortParam(value){
  const text = String(value || "").replace(/\s+/g, "");
  return text.length > 11 ? text.slice(0, 10) + "…" : text;
}

function operationText(explanation, index){
  const step = explanation?.steps?.find(item => item.operation_id === `op_${index}`);
  if(!step) return `第 ${index + 1} 步的白话解释暂时不可用。`;
  const terms = (step.terms || []).map(term => `${term.symbol}＝${term.meaning}`).join("；");
  return `第 ${index + 1} 步：${step.plain}\n为什么需要：${step.purpose}`
    + (terms ? `\n术语：${terms}` : "");
}

function targetMark(x, y){
  return `<circle class="target" cx="${x}" cy="${y}" r="11"></circle>`
    + `<line class="target-line" x1="${x-7}" y1="${y}" x2="${x+7}" y2="${y}"></line>`
    + `<line class="target-line" x1="${x}" y1="${y-7}" x2="${x}" y2="${y+7}"></line>`;
}

function swapMark(x, y){
  return `<line class="swap-line" x1="${x-8}" y1="${y-8}" x2="${x+8}" y2="${y+8}"></line>`
    + `<line class="swap-line" x1="${x+8}" y1="${y-8}" x2="${x-8}" y2="${y+8}"></line>`;
}

function boxGate(x, y, label, parameter=""){
  return `<rect class="box" x="${x-27}" y="${y-22}" width="54" height="44"></rect>`
    + `<text class="gate-label" x="${x}" y="${parameter ? y-5 : y}">${esc(label)}</text>`
    + (parameter ? `<text class="param" x="${x}" y="${y+13}">${esc(shortParam(parameter))}</text>` : "");
}

function circuitSvg(circuit, explanation){
  const operations = circuit.operations || [];
  const measurements = circuit.measurements || [];
  const qubits = Math.max(1, circuit.qubit_count || 1);
  const left = 126, top = 50, rowGap = 68, columnGap = 84;
  const firstGateX = left + 56;
  const measureX = firstGateX + operations.length * columnGap + 24;
  const width = Math.max(720, measureX + 180);
  const height = Math.max(190, top + (qubits - 1) * rowGap + 70);
  const y = q => top + q * rowGap;
  const parts = [
    `<svg class="circuit-svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="量子电路图">`,
    `<defs><marker id="c-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"></path></marker></defs>`,
    `<text class="measure-title" x="${measureX}" y="20">最后读取结果</text>`
  ];

  for(let q=0; q<qubits; q++){
    parts.push(`<text class="qlabel" x="${left-12}" y="${y(q)+5}">第 ${q+1} 位  q[${q}]</text>`);
    parts.push(`<line class="wire" x1="${left}" y1="${y(q)}" x2="${width-88}" y2="${y(q)}"></line>`);
  }

  operations.forEach((op, index) => {
    const x = firstGateX + index * columnGap;
    const ys = op.qubits.map(y);
    const title = operationText(explanation, index);
    parts.push(`<g class="gate" data-detail="${escAttr(title)}" tabindex="0" role="button" aria-label="${escAttr(title)}"><title>${esc(title)}</title>`);
    parts.push(`<text class="step" x="${x}" y="20">${index+1}</text>`);
    if(op.name === "cx"){
      parts.push(`<line class="connector" x1="${x}" y1="${Math.min(...ys)}" x2="${x}" y2="${Math.max(...ys)}"></line>`);
      parts.push(`<circle class="control" cx="${x}" cy="${ys[0]}" r="6"></circle>`);
      parts.push(targetMark(x, ys[1]));
    }else if(op.name === "cu1"){
      parts.push(`<line class="connector" x1="${x}" y1="${Math.min(...ys)}" x2="${x}" y2="${Math.max(...ys)}"></line>`);
      parts.push(`<circle class="control" cx="${x}" cy="${ys[0]}" r="6"></circle>`);
      parts.push(boxGate(x, ys[1], "U1", op.parameter));
    }else if(op.name === "swap"){
      parts.push(`<line class="connector" x1="${x}" y1="${Math.min(...ys)}" x2="${x}" y2="${Math.max(...ys)}"></line>`);
      parts.push(swapMark(x, ys[0]), swapMark(x, ys[1]));
    }else if(op.name === "ccx"){
      parts.push(`<line class="connector" x1="${x}" y1="${Math.min(...ys)}" x2="${x}" y2="${Math.max(...ys)}"></line>`);
      parts.push(`<circle class="control" cx="${x}" cy="${ys[0]}" r="6"></circle>`);
      parts.push(`<circle class="control" cx="${x}" cy="${ys[1]}" r="6"></circle>`);
      parts.push(targetMark(x, ys[2]));
    }else{
      parts.push(boxGate(x, ys[0], GATE_LABEL[op.name] || op.name.toUpperCase(), op.parameter));
    }
    parts.push(`</g>`);
  });

  measurements.forEach(m => {
    const my = y(m.qubit);
    parts.push(`<g aria-label="测量 q${m.qubit} 到 c${m.cbit}">`);
    parts.push(`<rect class="box" x="${measureX-22}" y="${my-19}" width="44" height="38"></rect>`);
    parts.push(`<path class="meter" d="M ${measureX-12} ${my+9} A 13 13 0 0 1 ${measureX+12} ${my+9}"></path>`);
    parts.push(`<line class="meter" x1="${measureX}" y1="${my+8}" x2="${measureX+10}" y2="${my-8}"></line>`);
    parts.push(`<line class="wire" x1="${measureX+22}" y1="${my}" x2="${width-88}" y2="${my}" marker-end="url(#c-arrow)"></line>`);
    parts.push(`<text class="clabel" x="${width-80}" y="${my+5}">结果 c[${m.cbit}]</text></g>`);
  });

  parts.push(`</svg>`);
  return `<div class="circuit-scroll">${parts.join("")}</div>`
    + `<div class="circuit-legend"><strong>怎么看：</strong>每条横线是一位量子信息，操作从左往右依次执行；● 是“条件开关”，⊕ 是被控制的翻转，仪表表示最后读取结果。</div>`
    + `<div class="circuit-detail" aria-live="polite">下面会用白话解释当前步骤，不需要先记住图里的符号。</div>`;
}

function bindCircuit(panel){
  panel.querySelectorAll(".gate").forEach(gate => {
    const show = () => {
      const block = gate.closest(".task-block") || panel;
      block.querySelectorAll(".gate").forEach(item => item.classList.toggle("selected", item === gate));
      block.querySelector(".circuit-detail").textContent = gate.dataset.detail;
    };
    gate.addEventListener("click", show);
    gate.addEventListener("focus", show);
    gate.addEventListener("keydown", event => {
      if(event.key === "Enter" || event.key === " "){ event.preventDefault(); show(); }
    });
  });
  panel.querySelectorAll(".task-block").forEach(block => {
    const first = block.querySelector(".gate");
    if(first){
      first.classList.add("selected");
      block.querySelector(".circuit-detail").textContent = first.dataset.detail;
    }
  });
}

function basisHtml(basis){
  if(!basis) return "";
  return `<div class="basis"><strong>依据：</strong>${esc(basis.source)} ${esc(basis.version)}；${esc(basis.status)}。</div>`;
}

function histogram(probs){
  const keys = Object.keys(probs).sort();
  if(!keys.length) return '<span class="muted">没有结果。</span>';
  const max = Math.max(...keys.map(k => probs[k]));
  return '<div class="hist">' + keys.map(k => {
    const h = Math.round((probs[k]/max) * 105) + 2;
    return `<div class="col"><span class="v">${(probs[k]*100).toFixed(1)}%</span>`
         + `<div class="b" style="height:${h}px"></div><span class="k">${esc(k)}</span></div>`;
  }).join("") + "</div>";
}

const LESSON_ICONS = {definition:"◎", analogy:"≈", example:"▶", fact:"i", caution:"!", action:"→"};

function conceptLessonHtml(lesson){
  const visualType = ["compare", "relation"].includes(lesson.visual.type) ? lesson.visual.type : "flow";
  const nodeList = lesson.visual.items.map(item =>
    `<div class="visual-node"><strong>${esc(item.label)}</strong><span>${esc(item.detail)}</span></div>`
  );
  const nodes = visualType === "relation"
    ? `${nodeList[0]}<div class="visual-link">${esc(lesson.visual.link)}</div>${nodeList[1]}`
    : nodeList.join("");
  const cards = lesson.cards.map(card =>
    `<section class="lesson-card"><h3><span class="lesson-icon">${LESSON_ICONS[card.kind] || "·"}</span>${esc(card.title)}</h3>`
    + `<p>${esc(card.body)}</p></section>`
  ).join("");
  return `<article class="lesson">`
    + `<header class="lesson-head"><span class="lesson-kicker">VISUAL EXPLAINER</span>`
    + `<h2>${esc(lesson.title)}</h2><p class="lesson-summary">${esc(lesson.summary)}</p></header>`
    + `<figure class="lesson-visual" role="img" aria-label="${escAttr(lesson.visual.caption)}">`
    + `<div class="visual-track visual-${visualType}">${nodes}</div>`
    + `<figcaption>${esc(lesson.visual.caption)}</figcaption></figure>`
    + `<div class="lesson-cards">${cards}</div>`
    + `<div class="lesson-takeaway"><strong>只记这一句：</strong>${esc(lesson.takeaway)}</div>`
    + `</article>`;
}

function circuitLessonHtml(lesson){
  const stepCards = lesson.steps.map((step, index) => {
    const terms = (step.terms || []).map(term =>
      `<span class="term-chip"><strong>${esc(term.symbol)}</strong>：${esc(term.meaning)}</span>`
    ).join("");
    return `<section class="circuit-lesson-step"><span class="step-number">${index + 1}</span><div>`
      + `<p><strong>${esc(step.plain)}</strong></p><p class="muted">为什么需要：${esc(step.purpose)}</p>${terms}</div></section>`;
  }).join("");
  const result = lesson.result
    ? `<section class="lesson-card"><h3><span class="lesson-icon">✓</span>本地验证结果</h3><p>${esc(lesson.result)}</p></section>`
    : "";
  return `<article class="lesson"><header class="lesson-head"><span class="lesson-kicker">CIRCUIT WALKTHROUGH</span>`
    + `<h2>这条电路在做什么？</h2><p class="lesson-summary">${esc(lesson.overview)}</p></header>`
    + `<div class="circuit-lesson-steps">${stepCards}</div><div class="lesson-cards">`
    + `<section class="lesson-card"><h3><span class="lesson-icon">M</span>怎么读结果</h3><p>${esc(lesson.measurement)}</p></section>`
    + `${result}</div></article>`;
}

function plainAnswerHtml(text){
  return `<article class="lesson"><header class="lesson-head"><span class="lesson-kicker">LOOMQ ANSWER</span>`
    + `<p class="lesson-summary">${esc(text).replace(/\n/g,"<br>")}</p></header></article>`;
}

function hasCompoundGoals(){
  return (state.tasks || []).length > 1 && state.tasks.some(task => task.kind === "circuit_build");
}

function taskNumber(kind){
  const index = (state.tasks || []).findIndex(task => task.kind === kind);
  return index < 0 ? 1 : index + 1;
}

function taskIdNumber(taskId){
  const number = Number(String(taskId || "").split("_")[1]);
  return Number.isFinite(number) ? number : 1;
}

function circuitItems(){
  if(state.circuits?.length) return state.circuits;
  if(!state.circuitData) return [];
  return [{
    task_id:`task_${taskNumber("circuit_build")}`,
    request:"生成电路",
    ok:true,
    circuit:state.circuitData,
    probabilities:state.result,
    expected_probabilities:state.expected,
    qasm:state.qasm,
    explanation:state.explanation
  }];
}

function taskBlockHtml(number, title, detail, body){
  return `<section class="task-block"><header class="task-heading"><span>任务 ${number}</span>`
    + `<strong>${esc(title)}</strong><small>${esc(detail)}</small></header>${body}</section>`;
}

function expectedResultText(expected=state.expected){
  const entries = Object.entries(expected || {}).filter(([, value]) => value > 0);
  if(!entries.length) return "已按用户目标生成并自检";
  return "目标：" + entries.map(([key, value]) => `${key} ${(value * 100).toFixed(0)}%`).join(" · ");
}

function render(tab){
  const p = $("panel");
  if(tab === "circuit"){
    const items = circuitItems();
    if(items.length){
      p.innerHTML = items.map(item => item.ok
        ? taskBlockHtml(taskIdNumber(item.task_id), "生成电路", item.request, circuitSvg(item.circuit, item.explanation))
        : taskBlockHtml(taskIdNumber(item.task_id), "生成电路失败", item.request, `<p class="muted">${esc(item.message)}</p>`)
      ).join("");
      bindCircuit(p);
    }
    else if(state.diagram) p.innerHTML = `<pre>${esc(state.diagram)}</pre>`;
    else p.innerHTML = '<span class="muted">还没有电路。</span>';
  }
  else if(tab === "result"){
    const items = circuitItems();
    p.innerHTML = items.length ? items.map(item => item.ok
      ? taskBlockHtml(taskIdNumber(item.task_id), "运行结果", expectedResultText(item.expected_probabilities), histogram(item.probabilities))
      : taskBlockHtml(taskIdNumber(item.task_id), "运行失败", item.request, `<p class="muted">${esc(item.message)}</p>`)
    ).join("") : '<span class="muted">还没有运行结果。</span>';
  }
  else if(tab === "qasm"){
    const items = circuitItems();
    p.innerHTML = items.length ? items.map(item => item.ok
      ? taskBlockHtml(taskIdNumber(item.task_id), "QASM", item.request, `<pre>${esc(item.qasm)}</pre>`)
      : taskBlockHtml(taskIdNumber(item.task_id), "QASM 未生成", item.request, `<p class="muted">${esc(item.message)}</p>`)
    ).join("") : '<span class="muted">还没有 QASM。</span>';
  }
  else if(state.concept && circuitItems().length && hasCompoundGoals()){
    const knowledge = (state.tasks || []).find(task => task.kind !== "circuit_build" && task.kind !== "backend_select");
    const knowledgeNumber = knowledge ? Number(knowledge.id.split("_")[1]) : 1;
    p.innerHTML = taskBlockHtml(knowledgeNumber, "理解问题", knowledge?.request || "概念与含义", conceptLessonHtml(state.concept))
      + circuitItems().map(item => item.ok && item.explanation
        ? taskBlockHtml(taskIdNumber(item.task_id), "生成电路", item.request, circuitLessonHtml(item.explanation))
        : taskBlockHtml(taskIdNumber(item.task_id), "生成电路失败", item.request, `<p class="muted">${esc(item.message || "解释暂时不可用")}</p>`)
      ).join("");
  }
  else if(state.concept && !state.circuitData) p.innerHTML = conceptLessonHtml(state.concept);
  else if(state.explanation) p.innerHTML = circuitLessonHtml(state.explanation);
  else p.innerHTML = state.explain ? `${plainAnswerHtml(state.explain)}${basisHtml(state.basis)}`
      : '<span class="muted">构建一个电路后，这里会用大白话解释它在做什么。</span>';
}

document.querySelectorAll(".tab").forEach(t => {
  const pick = () => {
    document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", String(x === t)));
    render(t.dataset.t);
  };
  t.addEventListener("click", pick);
  t.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(); }});
});

$("demo").addEventListener("click", () => {
  const box = $("examples");
  box.hidden = !box.hidden;
});
document.querySelectorAll(".ex").forEach(b =>
  b.addEventListener("click", () => { $("prompt").value = b.dataset.p; $("examples").hidden = true; build(); }));

$("prompt").addEventListener("keydown", e => {
  if((e.ctrlKey || e.metaKey) && e.key === "Enter") build();
});
$("go").addEventListener("click", build);

function expandBuilder(runDemo=false, focusPrompt=false, updateRoute=true){
  $("landing").classList.add("builder-mode");
  const route = runDemo ? "/builder?demo=bell" : "/builder";
  if(updateRoute && location.pathname + location.search !== route){
    history.pushState({}, "", route);
  }
  window.scrollTo({top:0, behavior:"smooth"});
  if(runDemo){
    $("prompt").value = "做一个贝尔态";
    build();
  }else if(focusPrompt){
    $("prompt").focus();
  }
}
$("get-started").addEventListener("click", () => expandBuilder(false, true));
$("launch-demo").addEventListener("click", () => expandBuilder(true));
window.addEventListener("popstate", () =>
  $("landing").classList.toggle("builder-mode", location.pathname === "/builder"));

async function build(){
  const prompt = $("prompt").value.trim();
  if(!prompt){
    steps([{k:"err", t:"先说一句你想做什么 —— 比如「让三个量子比特纠缠在一起」。"}]);
    $("prompt").focus();
    return;
  }
  busy(true);
  steps([{k:"run", t:"正在理解你的意思…"}]);
  try{
    const res = await fetch("/api/build", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({prompt})
    });
    const data = await res.json();
    if(data.kind === "partial"){
      state = {diagram:"", circuitData:null, result:null, expected:null, qasm:"", explain:data.explain, explanation:null, concept:data.concept || null, tasks:data.tasks || null, circuits:null, backend:null, basis:null};
      const knowledgeTask = (state.tasks || []).find(task => task.kind !== "circuit_build" && task.kind !== "backend_select");
      const knowledgeNumber = knowledgeTask ? Number(knowledgeTask.id.split("_")[1]) : 1;
      steps([
        {k:"ok", t:`任务 ${knowledgeNumber}：理解问题已完成`},
        {k:"err", t:`任务 ${taskNumber("circuit_build")}：候选电路未通过目标校验`}
      ]);
      $("fid").textContent = "保真度 —";
      document.querySelectorAll(".tab").forEach(x =>
        x.setAttribute("aria-selected", String(x.dataset.t === "explain")));
      render("explain");
    } else if(data.kind === "explanation"){
      state = {diagram:"", circuitData:null, result:null, expected:null, qasm:"", explain:data.explain, explanation:null, concept:data.concept || null, tasks:data.tasks || null, circuits:null, backend:null, basis:null};
      const intentLabel = data.intent?.label;
      steps(intentLabel && data.concept
        ? [{k:"ok", t:`听懂了：${intentLabel}`}, {k:"ok", t:"已生成图解"}]
        : [{k:"ok", t:"已回答你的问题"}, {k:"err", t:"图解暂时不可用，已保留基础回答"}]);
      $("fid").textContent = "保真度 —";
      document.querySelectorAll(".tab").forEach(x =>
        x.setAttribute("aria-selected", String(x.dataset.t === "explain")));
      render("explain");
    } else if(data.kind === "backend"){
      state = {diagram:"", circuitData:null, result:null, expected:null, qasm:"", explain:data.explain, explanation:null, concept:null, tasks:data.tasks || null, circuits:null, backend:data.backend, basis:data.basis || null};
      steps([{k:"ok", t:"听懂了：你在挑运行平台"}, {k:"ok", t:"已按官方后端能力表筛选"}]);
      $("fid").textContent = "保真度 —";
      document.querySelectorAll(".tab").forEach(x =>
        x.setAttribute("aria-selected", String(x.dataset.t === "explain")));
      render("explain");
    } else if(data.ok){
      state = {diagram:data.diagram, circuitData:data.circuit || null, result:data.probabilities, expected:data.expected_probabilities || null, qasm:data.qasm, explain:data.explain, explanation:data.explanation || null, concept:data.concept || null, tasks:data.tasks || null, circuits:data.circuits || null, backend:null, basis:null};
      const intentLabel = data.intent?.label || "你想构建一个量子电路";
      const compound = (data.tasks || []).length > 1;
      const list = [{k:"ok", t:`听懂了：${intentLabel}`}];
      if(compound){
        const knowledgeTask = (state.tasks || []).find(task => task.kind !== "circuit_build" && task.kind !== "backend_select");
        if(knowledgeTask){
          const knowledgeNumber = Number(knowledgeTask.id.split("_")[1]);
          list.push({k:"ok", t:`任务 ${knowledgeNumber}：理解问题已单独解释`});
        }
      }
      circuitItems().forEach(item => list.push(item.ok
        ? {k:"ok", t:`任务 ${taskIdNumber(item.task_id)}：电路已生成并运行`}
        : {k:"err", t:`任务 ${taskIdNumber(item.task_id)}：${item.message}`}
      ));
      list.push(data.all_tasks_ok === false
        ? {k:"err", t:"部分任务未通过目标语义自检"}
        : {k:"ok", t:"全部电路均通过目标语义自检"});
      steps(list);
      const passedCircuits = circuitItems().filter(item => item.ok).length;
      $("fid").textContent = circuitItems().length > 1 ? `${passedCircuits}/${circuitItems().length} 电路通过`
        : data.fidelity !== null ? `保真度 ${data.fidelity.toFixed(2)}` : "保真度 —";
      document.querySelectorAll(".tab").forEach(x =>
        x.setAttribute("aria-selected", String(x.dataset.t === "circuit")));
      render("circuit");
    } else {
      steps([{k:"err", t:data.message}]);
      $("fid").textContent = "保真度 —";
      if(data.qasm){ state.qasm = data.qasm; }
    }
  }catch(err){
    steps([{k:"err", t:"连不上本地服务，请确认终端里的服务还在运行。"}]);
  }finally{
    busy(false);
  }
}
render("circuit");
if(location.pathname === "/builder"){
  const runDemo = new URLSearchParams(location.search).get("demo") === "bell";
  expandBuilder(runDemo, !runDemo, false);
}
</script>
</body>
</html>
